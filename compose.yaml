services:
  jalvio:
    build:
      context: .
      args:
        VERSION: ${JALVIO_VERSION:-dev}
    image: jalvio-service:${JALVIO_VERSION:-dev}
    env_file: .env
    ports:
      - "${JALVIO_PORT:-8080}:8080"
    volumes:
      - jalvio-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s

  community:
    profiles: [community]
    build:
      context: .
      args:
        VERSION: ${JALVIO_VERSION:-dev}
    image: jalvio-service:${JALVIO_VERSION:-dev}
    entrypoint: ["/community"]
    env_file:
      - path: .env
        required: false
    environment:
      # Set COMMUNITY_DATABASE_URL in .env to use a hosted database instead.
      COMMUNITY_DATABASE_URL: ${COMMUNITY_DATABASE_URL:-postgres://community:community@community-db:5432/community?sslmode=disable}
    ports:
      - "${COMMUNITY_PORT:-8081}:8081"
    depends_on:
      community-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/community", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s

  community-db:
    profiles: [community]
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - community-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "community", "-d", "community"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  jalvio-data:
  community-db-data:
