name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.8.12
          install: true
          cache: true
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run vuln
      - run: mise run cover-check
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage.out
          format: golang
          fail-on-error: false

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: jalvio-service:ci
          build-args: VERSION=${{ github.sha }}
      - name: Run the image against the fixture feed until it is ready
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          (cd internal/catalog/testdata/feed && zip -q "$RUNNER_TEMP/feed/feed.zip" *.txt)
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/feed" &
          docker run -d --name jalvio --network host -e GTFS_URL=http://127.0.0.1:8000/feed.zip jalvio-service:ci
          for _ in $(seq 30); do
            if docker exec jalvio /jalvio healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs jalvio
          exit 1
