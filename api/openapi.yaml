openapi: 3.0.3
info:
  title: jalvio-service
  version: "1"
  description: |
    Public transit data for the Jalvio app. Access is anonymous.

    One instance serves one or more regions (cities). Everything specific to
    a region lives under `/v1/regions/{region}/`.

    The app is offline first: it keeps a region's `catalog` and
    `catalog/shapes` on the device, refreshes them with `If-None-Match`, and
    computes static screens, search, and timetables from them.

    JSON is camelCase, times are RFC 3339 in UTC, and coordinates are
    `{lat, lng}`. Errors are RFC 9457 problem details.
  license:
    name: Apache-2.0

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Readiness
      responses:
        "204":
          description: Ready. No body.
        "503":
          description: Not ready, or draining. No body.

  /v1/status:
    get:
      operationId: getStatus
      summary: State of the catalog, the live feed, and the stop facilities sync
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /v1/regions/{region}/catalog:
    get:
      operationId: getCatalog
      summary: A region's whole static network, for offline use
      description: |
        Changes when the feed or the stop facilities change, usually less
        than once a day. Send the stored ETag in `If-None-Match`.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The catalog.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "304":
          description: The stored copy is current. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/regions/{region}/catalog/shapes:
    get:
      operationId: getCatalogShapes
      summary: Route lines for every pattern in a region, for offline use
      description: Changes only with the feed. Send the stored ETag in `If-None-Match`.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The shapes.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shapes"
        "304":
          description: The stored copy is current. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/regions/{region}/departures:
    get:
      operationId: getDepartures
      summary: Live departures at up to ten stops
      description: |
        Buses the live feed expects at each stop, grouped by route and
        headsign, soonest first, at most three per group. A platform reports
        the departures of its station. Scheduled times come from the catalog
        on the device, not from this endpoint.

        Live data covers what clients are watching. A newly watched area,
        route, stop or bus starts empty and fills within about 10 s as buses
        report.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: stops
          in: query
          required: true
          description: Comma-separated stop IDs, one to ten.
          schema:
            type: string
      responses:
        "200":
          description: Departures per requested stop, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Departures"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/regions/{region}/buses:
    get:
      operationId: listBuses
      summary: Live buses in an area, on routes, or both
      description: |
        Live data covers what clients are watching. A newly watched area,
        route, stop or bus starts empty and fills within about 10 s as buses
        report.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: bbox
          in: query
          required: false
          description: "`west,south,east,north`, at most one degree on each axis."
          schema:
            type: string
        - name: routes
          in: query
          required: false
          description: Comma-separated route IDs. At least one of `bbox` and `routes` is required.
          schema:
            type: string
      responses:
        "200":
          description: Matching buses, ordered by fleet number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buses"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/regions/{region}/buses/{fleetNumber}:
    get:
      operationId: getBus
      summary: One live bus and the stops it is expected at
      description: |
        Live data covers what clients are watching. A newly watched area,
        route, stop or bus starts empty and fills within about 10 s as buses
        report, so the first request for a bus can answer 404.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: fleetNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The bus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusDetail"
        "404":
          description: The bus is not reporting, or the region is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/regions/{region}/live:
    get:
      operationId: streamLive
      summary: A region's live buses pushed over a WebSocket, for the map
      description: |
        Upgrade with subprotocol `jalvio.live.v1`. The frames are described
        in [`live.schema.json`](live.schema.json).

        The server sends `status` first. Each `subscribe` from the client
        gets a `snapshot`, followed by `update` frames at most once a second.
        A status frame follows any change of the feed state or the catalog
        version.

        Live data covers what clients are watching. A newly watched area,
        route, stop or bus starts empty and fills within about 10 s as buses
        report, through `update` frames.

        Close codes: `1008` for a bad or too frequent subscribe, `1009` for a
        frame over 4 KiB, `1013` when the client reads too slowly, and `1001`
        when the service shuts down. The server pings every 25 s.

        Browsers must send an allowed `Origin`; the native apps send none.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switched to the WebSocket protocol.
        "400":
          description: Not a WebSocket upgrade, or `jalvio.live.v1` not offered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The `Origin` is not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "503":
          description: No catalog has been loaded yet, or the connection limit is reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/regions/{region}/places:
    get:
      operationId: searchPlaces
      summary: Destinations (addresses and points of interest) matching a query
      description: |
        Results come from an OpenStreetMap geocoder, limited to the area the
        region's network serves. Show `attribution` with them. Stops and
        routes are searched on the device, in the catalog.
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: q
          in: query
          required: true
          description: At least 3 characters.
          schema:
            type: string
        - name: near
          in: query
          required: false
          description: "`lat,lng` to rank results by; defaults to the network's centre."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 1 to 20; defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Matching places, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Places"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/UnknownRegion"
        "429":
          $ref: "#/components/responses/PlacesBusy"
        "502":
          $ref: "#/components/responses/PlacesFailed"
        "503":
          $ref: "#/components/responses/PlacesDisabled"

  /v1/regions/{region}/places/reverse:
    get:
      operationId: reversePlace
      summary: The address or place at a point
      parameters:
        - $ref: "#/components/parameters/RegionId"
        - name: at
          in: query
          required: true
          description: "`lat,lng`"
          schema:
            type: string
      responses:
        "200":
          description: The nearest place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReversePlace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The geocoder knows nothing there, or the region is unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/PlacesBusy"
        "502":
          $ref: "#/components/responses/PlacesFailed"
        "503":
          $ref: "#/components/responses/PlacesDisabled"

  /v1/legal/{document}:
    get:
      operationId: getLegalDocument
      summary: The terms or the privacy policy, as this instance's owner publishes them
      description: |
        Changes only when the owner publishes a new version. Send the stored
        ETag in `If-None-Match`. Keep the `updated` date the rider last saw,
        and tell them about the change when it differs.
      parameters:
        - name: document
          in: path
          required: true
          schema:
            type: string
            enum: [terms, privacy]
        - name: lang
          in: query
          required: false
          description: "`en` (the default) or `id`. A document without that translation is served in English."
          schema:
            type: string
            enum: [en, id]
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The document.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Content-Language:
              required: true
              description: The language served, as in `language`.
              schema:
                type: string
                enum: [en, id]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "304":
          description: The stored copy is current. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The document is unknown, or this instance's owner has not published it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  parameters:
    RegionId:
      name: region
      in: path
      required: true
      description: A region id from `/v1/regions`.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string

  headers:
    ETag:
      required: true
      schema:
        type: string

  responses:
    UnknownRegion:
      description: The instance serves no region with this id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotReady:
      description: No catalog has been loaded yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: A query parameter is missing or invalid; `detail` says which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlacesBusy:
      description: The service's share of the geocoder is used up for now; retry shortly. Repeated lookups are answered from a cache.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlacesFailed:
      description: The geocoder failed or timed out.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlacesDisabled:
      description: Place search is not configured on this instance.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    FeedState:
      type: string
      description: |
        Whether live data is flowing. With `disabled` or `disconnected`, an
        empty result means no data rather than no buses.
      enum: [disabled, connected, disconnected]

    Departures:
      type: object
      additionalProperties: false
      required: [feed, stops]
      properties:
        feed:
          $ref: "#/components/schemas/FeedState"
        stops:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stopId, departures]
            properties:
              stopId:
                type: string
              departures:
                type: array
                description: Empty for stops not in the catalog.
                items:
                  $ref: "#/components/schemas/DepartureGroup"

    DepartureGroup:
      type: object
      additionalProperties: false
      required: [routeCode, buses]
      properties:
        routeId:
          type: string
          description: Absent when the route is not in the catalog.
        routeCode:
          type: string
        headsign:
          type: string
        buses:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/Arrival"

    Arrival:
      type: object
      additionalProperties: false
      required: [fleetNumber, patternId, minutes, observedAt, stale]
      properties:
        fleetNumber:
          type: string
        patternId:
          type: string
        minutes:
          type: integer
          minimum: 0
          description: Minutes until arrival as of `observedAt`.
        observedAt:
          type: string
          format: date-time
          description: When the bus reported, never later than when the server received it.
        stale:
          type: boolean

    Buses:
      type: object
      additionalProperties: false
      required: [feed, buses]
      properties:
        feed:
          $ref: "#/components/schemas/FeedState"
        buses:
          type: array
          items:
            $ref: "#/components/schemas/Bus"

    BusDetail:
      type: object
      additionalProperties: false
      required: [feed, bus, upcoming]
      properties:
        feed:
          $ref: "#/components/schemas/FeedState"
        bus:
          $ref: "#/components/schemas/Bus"
        upcoming:
          type: array
          description: Stops the bus is expected at, soonest first.
          items:
            type: object
            additionalProperties: false
            required: [stopId, minutes]
            properties:
              stopId:
                type: string
              minutes:
                type: integer
                minimum: 0

    Bus:
      type: object
      additionalProperties: false
      required: [fleetNumber, routeCode, patternId, position, bearing, observedAt, stale]
      properties:
        fleetNumber:
          type: string
          description: The number painted on the bus.
        routeId:
          type: string
          description: Absent when the route is not in the catalog.
        routeCode:
          type: string
        patternId:
          type: string
        headsign:
          type: string
        class:
          type: string
        vehicleType:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        bearing:
          type: integer
        prevStopId:
          type: string
        nextStopId:
          type: string
        atStopId:
          type: string
          description: Present while the bus is at a stop.
        nextStopDistanceMeters:
          type: integer
          minimum: 1
        observedAt:
          type: string
          format: date-time
          description: When the bus reported, never later than when the server received it.
        stale:
          type: boolean
          description: No report for a minute; the position may be out of date.

    Places:
      type: object
      additionalProperties: false
      required: [attribution, places]
      properties:
        attribution:
          $ref: "#/components/schemas/Attribution"
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"

    ReversePlace:
      type: object
      additionalProperties: false
      required: [attribution, place]
      properties:
        attribution:
          $ref: "#/components/schemas/Attribution"
        place:
          $ref: "#/components/schemas/Place"

    Attribution:
      type: string
      description: Credit for the map data, to show with the results.

    Place:
      type: object
      additionalProperties: false
      required: [name, position]
      properties:
        id:
          type: string
          description: "`osm:` plus the OSM element type letter and ID, e.g. `osm:W123`."
        name:
          type: string
        label:
          type: string
          description: Street, district, and city, for a second line.
        kind:
          type: string
          description: The OSM category value, e.g. `mall`, `school`, `bus_stop`.
        position:
          $ref: "#/components/schemas/Position"

    Status:
      type: object
      additionalProperties: false
      required: [version, startedAt, regions]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        regions:
          type: array
          description: Every region the instance serves, in its configured order.
          items:
            $ref: "#/components/schemas/RegionStatus"

    RegionStatus:
      type: object
      additionalProperties: false
      required: [id, catalog, feed, stopFacilities]
      properties:
        id:
          type: string
        catalog:
          type: object
          additionalProperties: false
          properties:
            version:
              type: string
            updatedAt:
              type: string
              format: date-time
            checkedAt:
              type: string
              format: date-time
            error:
              type: string
        feed:
          type: object
          additionalProperties: false
          required: [state, reconnects, messages, malformed, buses, filters, wholeFleet]
          properties:
            state:
              type: string
              enum: [disabled, connected, disconnected]
            lastMessageAt:
              type: string
              format: date-time
            delaySeconds:
              type: number
              description: >-
                Median seconds from a bus report's own timestamp to its receipt, over the
                last 1000 reports. It grows when the broker falls behind sending to this
                instance. Absent until a report arrives.
            reconnects:
              type: integer
            messages:
              type: integer
              format: int64
            malformed:
              type: integer
              format: int64
            rejected:
              type: object
              additionalProperties:
                type: integer
                format: int64
            buses:
              type: integer
            filters:
              type: integer
              description: Broker filters currently subscribed for what clients watch.
            wholeFleet:
              type: boolean
              description: The whole fleet is subscribed because clients watch more than 1500 broker filters (map tiles, routes and buses together).
        stopFacilities:
          type: object
          additionalProperties: false
          required: [state, requests, matched, unmatched]
          properties:
            state:
              type: string
              enum: [disabled, pending, synced]
            syncedAt:
              type: string
              format: date-time
            checkedAt:
              type: string
              format: date-time
            error:
              type: string
            requests:
              type: integer
            matched:
              type: integer
            unmatched:
              type: integer

    Catalog:
      type: object
      additionalProperties: false
      required: [feedVersion, routes, stops, patterns, services, fares]
      properties:
        feedVersion:
          type: string
          description: SHA-256 of the static feed.
        facilitiesSyncedAt:
          type: string
          format: date-time
          description: When stop facilities were last synced. Absent before the first sync.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/Pattern"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        fares:
          type: array
          items:
            $ref: "#/components/schemas/Fare"

    Route:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
          description: The code shown on the badge and the bus.
        name:
          type: string
        class:
          type: string
        color:
          type: string
          description: Hex RGB without `#`.
          pattern: "^[0-9A-Fa-f]{6}$"
        textColor:
          type: string
          pattern: "^[0-9A-Fa-f]{6}$"
        fareId:
          type: string

    Stop:
      type: object
      additionalProperties: false
      required: [id, name, kind, position, routeIds]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [station, platform, roadside]
        position:
          $ref: "#/components/schemas/Position"
        parentId:
          type: string
          description: The station a platform belongs to.
        childIds:
          type: array
          items:
            type: string
        platformCode:
          type: string
          description: Door letters, such as `D-E-F`.
        description:
          type: string
        routeIds:
          type: array
          items:
            type: string
        transferIds:
          type: array
          description: Stops within a short walk where riders can change.
          items:
            type: string
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/Facility"

    Position:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number

    Facility:
      type: object
      additionalProperties: false
      required: [key, title]
      properties:
        key:
          type: string
          description: Stable key that clients map to an icon, such as `toilet` or `lift`.
        title:
          type: string
          description: Text to show for keys the client does not know.

    Pattern:
      type: object
      additionalProperties: false
      description: One stop sequence of a route, run at the given headways on the service's days.
      required: [id, routeId, direction, serviceId, stops, headways]
      properties:
        id:
          type: string
          description: Equal to the trip ID that live buses report.
        routeId:
          type: string
        direction:
          type: integer
          enum: [0, 1]
        headsign:
          type: string
        name:
          type: string
        serviceId:
          type: string
        stops:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/PatternStop"
        headways:
          type: array
          items:
            $ref: "#/components/schemas/Headway"

    PatternStop:
      type: object
      additionalProperties: false
      required: [stopId, fromStartSeconds]
      properties:
        stopId:
          type: string
        fromStartSeconds:
          type: integer
          minimum: 0
          description: Scheduled time from the first stop of the pattern.

    Headway:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds, everySeconds]
      description: Seconds from midnight of the service day; may exceed 86400 past midnight.
      properties:
        startSeconds:
          type: integer
          minimum: 0
        endSeconds:
          type: integer
          minimum: 0
        everySeconds:
          type: integer
          minimum: 1

    Service:
      type: object
      additionalProperties: false
      required: [id, days, startDate, endDate]
      properties:
        id:
          type: string
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Fare:
      type: object
      additionalProperties: false
      required: [id, price, currency]
      properties:
        id:
          type: string
        price:
          type: integer
          format: int64
          description: In whole units of the currency.
        currency:
          type: string
          description: ISO 4217 code.

    Shapes:
      type: object
      additionalProperties: false
      required: [feedVersion, shapes]
      properties:
        feedVersion:
          type: string
        shapes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [patternId, polyline]
            properties:
              patternId:
                type: string
              polyline:
                type: string
                description: Google encoded polyline, five decimals.

    LegalDocument:
      type: object
      additionalProperties: false
      required: [document, language, updated, title, summary, sections]
      properties:
        document:
          type: string
          enum: [terms, privacy]
        language:
          type: string
          enum: [en, id]
          description: The language served; English when the requested translation is missing.
        updated:
          type: string
          format: date
          description: The owner's date for this version, shared by its translations.
        title:
          type: string
        summary:
          type: array
          description: The short version, shown before the sections.
          items:
            $ref: "#/components/schemas/LegalPoint"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/LegalSection"

    LegalPoint:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        icon:
          type: string
          description: An icon name for the app to look up, such as `lock`.
        text:
          type: string

    LegalSection:
      type: object
      additionalProperties: false
      description: Has `text`, `rows`, or both.
      required: [id, title]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: Stable within the document, so other screens can link to the section.
        title:
          type: string
        text:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LegalRow"

    LegalRow:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        icon:
          type: string
          description: An icon name for the app to look up, such as `my_location`.
        title:
          type: string
        description:
          type: string
        tag:
          type: string
          description: A short label such as `While using`. The app may show the rider's own setting instead.
