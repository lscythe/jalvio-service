version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: (_test\.go|test/[^/]+\.go)$
        linters: [gosec]
formatters:
  enable:
    - gofumpt
    - goimports
