[tools]
go = "1.27.3"
"go:mvdan.cc/gofumpt" = "0.11.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
lefthook = "2.1.14"

[tasks.fmt]
run = "gofumpt -w ."

[tasks.fmt-check]
run = "files=\"$(gofumpt -l .)\"; test -z \"$files\" || { printf 'Unformatted files:\\n%s\\n' \"$files\"; exit 1; }"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = "go test ./..."

[tasks.race]
run = "go test -race ./..."

[tasks.cover]
description = "Race-test with coverage, excluding test helper packages"
run = [
    "go test -race -covermode=atomic -coverprofile=coverage.raw ./...",
    "grep -vE 'test/[^/]+\\.go:' coverage.raw > coverage.out",
    "rm coverage.raw",
]

[tasks.cover-check]
description = "Require tests in every package and 80% coverage outside cmd/"
depends = ["cover"]
run = "go run ./cmd/covergate"

[tasks.vuln]
run = "govulncheck ./..."

[tasks.live]
description = "Check the real upstreams in the regions file and environment (opt-in)"
run = "go test -tags live -count=1 -v ./test/live"

[tasks.check]
depends = ["fmt-check", "lint", "cover-check", "vuln"]
